にし、弓の曲線と修復の精度が主役になる余白を確保した。", "brand_intent": "弓のしなりと精度を取り戻し、奏者の表現を支える。", "image": "assets/N053.jpg", "thumb": "assets/N053-thumb.jpg"}, {"id": "N054", "name": "coil8", "group": "N 参考からの新規案", "description": "交換式ノートのリング部品ブランド", "intent": "丸い内白を揃える方法を、ノートのリングと8の二つの穴に応用した。囲みを外し、最後の8だけ上側を少し開いて交換できる部品の仕組みを表した。", "brand_intent": "記録を使い捨てず、部品の交換で長く書き続けられるようにする。", "image": "assets/N054.jpg", "thumb": "assets/N054-thumb.jpg"}, {"id": "N055", "name": "針路", "group": "N 参考からの新規案", "description": "機械式時計の調整工房", "intent": "針と路の長い縦画を細い目盛りに重ね、時計の調整という仕事を文字の精度へ移した。漢字の内白を広く保ち、短い横画の間隔を揃えて静かな時間のリズムを作った。", "brand_intent": "受け継いだ時計が正しく時を刻むよう、見えない精度を整えて長く使う人を支える。", "image": "assets/N055.jpg", "thumb": "assets/N055-thumb.jpg"}, {"id": "N056", "name": "すいめん", "group": "N 参考からの新規案", "description": "水面を使う静養フロートサロン", "intent": "水平線を二つの静かな波の開口へ変え、浮遊する身体を囲わない余白として表した。ひらがなの丸い内白と細い終筆を揃え、水の静けさと呼吸の間を文字にも持たせた。", "brand_intent": "刺激の多い日常から離れ、水に浮かぶ短い休息で呼吸と感覚を取り戻す時間を届ける。", "image": "assets/N056.jpg", "thumb": "assets/N056-thumb.jpg"}, {"id": "N057", "name": "ロープリンク", "group": "N 参考からの新規案", "description": "産業用ロープの点検・再加工", "intent": "折り返す帯の原理を、荷重を受ける二本のロープが結び目で向きを変える形へ移した。交差点に白い切れ目を残して上下関係を読みやすくし、太いカタカナで現場の道具らしい安定を添えた。", "brand_intent": "現場で使われるロープを点検し、傷んだ箇所を見極めて安全に再利用できる状態へつなぐ。", "image": "assets/N057.jpg", "thumb": "assets/N057-thumb.jpg"}, {"id": "N058", "name": "紙と針", "group": "N 参考からの新規案", "description": "製本と紙修復工房", "intent": "紙の薄さと針の精度を、細い明朝骨格と引き締めた縦画へ移した。間の「と」を少し低く開いて、手作業の柔らかな呼吸を作った。", "brand_intent": "本の記憶を継いで使う人へ、手で直せる安心を届ける。", "image": "assets/N058.jpg", "thumb": "assets/N058-thumb.jpg"}, {"id": "N059", "name": "REELP!", "group": "N 参考からの新規案", "description": "映画フィルムの回収・再利用サービス", "intent": "フィルムの巻き戻しを一本の帯が巡る形にし、素材の循環を示した。二つの小さな送り穴と傾いた太い文字で、回収を前向きな動作として伝える。", "brand_intent": "上映を終えたフィルムを次の表現につなぎ、作り手の記録を捨てずに循環させる。", "image": "assets/N059.jpg", "thumb": "assets/N059-thumb.jpg"}, {"id": "N060", "name": "90TURN", "group": "N 参考からの新規案", "description": "家具の旋回金具ブランド", "intent": "直角に回る金具の動きを数字90の曲がりと円へ込め、名称そのものを機能の説明にした。数字と英字の高さを揃えつつRの脚を回転方向へ開き、硬い素材と軽い動作を両立させた。", "brand_intent": "狭い住空間でも家具を軽く動かし、使い方を変えられる自由を届ける。", "image": "assets/N060.jpg", "thumb": "assets/N060-thumb.jpg"}, {"id": "N061", "name": "糸巻工房", "group": "N 参考からの新規案", "description": "糸の小巻き加工工房", "intent": "職人が糸を巻き取る動作を中央の線画にし、糸巻工房の漢字を上弧に沿わせた。巻かれる糸と円周文字の関係で手仕事の継続を表し、文字の骨格は保って読める印にした。", "brand_intent": "小さな服飾作家が使いやすい量の糸を、丁寧に巻き直して届ける。", "image": "assets/N061.jpg", "thumb": "assets/N061-thumb.jpg"}, {"id": "N062", "name": "かみあそび", "group": "N 参考からの新規案", "description": "子どもの紙造形ワークショップ", "intent": "紙を切る動きをかなの角端と面のゆらぎへ移し、一文字ごとの違いを遊びの幅にした。か・み・あ・そ・びの識別骨格と濁点を残し、切り絵の自由さと読める看板を両立させた。", "brand_intent": "切る・折る・貼るを通して、子どもが自分の発想を自由に形にできる場を届ける。", "image": "assets/N062.jpg", "thumb": "assets/N062-thumb.jpg"}, {"id": "N063", "name": "ネジナオシ", "group": "N 参考からの新規案", "description": "家具のネジ締め・補修サービス", "intent": "ネジを締める回転を左の円形工具マークへ凝縮し、カタカナは太い骨格を崩さず横一列に組んだ。ネ・ジ・ナ・オ・シの短画と濁点を独立させ、修理の確かさを文字の明快さと接点の整合で表した。", "brand_intent": "捨てる前に小さな緩みを直し、家具と暮らしを長く保つ選択肢を届ける。", "image": "assets/N063.jpg", "thumb": "assets/N063-thumb.jpg"}, {"id": "N064", "name": "層波精工", "group": "N 参考からの新規案", "description": "薄板積層部品の加工", "intent": "一定間隔の薄板を横長の開いた層として重ね、角形の漢字に合わせた。閉じた樽形を避けて部品断面に変え、細い隙間と太い字の対比で精度を見せる。", "brand_intent": "薄い金属板の加工精度を小規模開発者に届ける。", "image": "assets/N064.jpg", "thumb": "assets/N064-thumb.jpg"}, {"id": "N065", "name": "余白書房", "group": "N 参考からの新規案", "description": "小さな詩集の出版", "intent": "余の一字を縦長の細い筆線で描き、隣に余白書房を縦に組んだ。円の囲いを外して文字間の白を広く取り、線の緊張と静かな列の関係を試す。", "brand_intent": "短い詩を落ち着いて読める本を届ける。", "image": "assets/N065.jpg", "thumb": "assets/N065-thumb.jpg"}, {"id": "N066", "name": "こねる日", "group": "N 参考からの新規案", "description": "粘土の小さな造形教室", "intent": "こねる日を短い横列にし、こねるの曲線と日の四角を対比させた。横のマークは二本の押された弧だけに絞り、文字の内白を隠さず形の柔らかさを試す。", "brand_intent": "手で形をつくる時間を初心者にも届ける。", "image": "assets/N066.jpg", "thumb": "assets/N066-thumb.jpg"}, {"id": "N067", "name": "つりあい", "group": "N 参考からの新規案", "description": "小規模店の入出金照合サービス", "intent": "つの長い弧とりの二画を同じ角丸半径で作り、あの結びだけを天秤の支点に似た小さな菱形の内白へ変形する。文字間はつりを近く、あいを開き、四字の黒量を均す。", "brand_intent": "店の収支の釣り合いをひと目で確かめる。", "image": "assets/N067.jpg", "thumb": "assets/N067-thumb.jpg"}, {"id": "N070", "name": "ひらのび", "group": "N 参考からの新規案", "description": "手延べ麺", "intent": "全字を幅広い帯と細い首の規則で作字し、最後のびの払いだけを一度延ばす。麺を引く動作を独立した輪と長い終筆へ移し、文字の読みを残しながら固有性を作る。", "brand_intent": "手で延ばす麺の軽い口当たりを日常の食卓へ届ける。", "image": "assets/N070.jpg", "thumb": "assets/N070-thumb.jpg"}, {"id": "N072", "name": "つむぎわ", "group": "N 参考からの新規案", "description": "古い衣服の補修", "intent": "全字に斜めの起筆とふくらむ下弧を通し、わの終筆だけを外へ返す。上の輪マークに細い切れ目を残し、文字の内白と揃えて軽い連続感を作る。", "brand_intent": "一着の時間を途切れさせず、次の持ち主へつなぐ。", "image": "assets/N072.jpg", "thumb": "assets/N072-thumb.jpg"}, {"id": "N074", "name": "ハコメグ", "group": "N 参考からの新規案", "description": "循環梱包材", "intent": "箱の開口を緑の折り返しへ変え、メの交点にも白い抜きを設けた。太い角帯と共通の斜め切口を四字とマークへ通し、一組の輪郭を作る意図。", "brand_intent": "物流担当者へ、繰り返し使える梱包材で廃棄を減らし、回収を続けやすい仕組みを届ける。", "image": "assets/N074.jpg", "thumb": "assets/N074-thumb.jpg"}, {"id": "N077", "name": "空組", "group": "N 参考からの新規案", "description": "可変間仕切り設計", "intent": "空と組を同じ角線と斜め面取りで描き、接点の細い隙間を間仕切りの開口へ対応させた。空の下横を字間へ伸ばし、二字と小さなマークを一つの余白単位でまとめる意図。", "brand_intent": "住まい手と設計者へ、使い方の変化に合わせて空間を組み替えられる設計を届ける。", "image": "assets/N077.jpg", "thumb": "assets/N077-thumb.jpg"}, {"id": "N078", "name": "ツギテ", "group": "N 参考からの新規案", "description": "部品接続設計", "intent": "接続部の段差をギの横画端と二本の帯のマークに反復した。全字の角帯と内向きの斜切口を揃え、ツの点とギの濁点を分離して強い黒量と読みを両立させる意図。", "brand_intent": "製造現場へ、部品同士を確実につなぎ、分解や交換もしやすい接続設計を届ける。", "image": "assets/N078.jpg", "thumb": "assets/N078-thumb.jpg"}, {"id": "N079", "name": "あわのわ", "group": "N 参考からの新規案", "description": "発酵ソーダ工房", "intent": "かなの運筆を滑らかな膨隆へ置き換え、二つのわの輪を大小にして泡が育つリズムを狙った。全字の細い入りと丸い腹を揃え、文字だけで弾力のある面をつくる。", "brand_intent": "発酵飲料を楽しむ人へ、自然な泡の軽やかさと手仕事の充実感を届ける。", "image": "assets/N079.jpg", "thumb": "assets/N079-thumb.jpg"}, {"id": "N080", "name": "ゆきのね", "group": "N 参考からの新規案", "description": "雪国の小さな音楽宿", "intent": "縦列の上を細長く下を横広にし、ゆからねへ音が落ち着くような重心変化を狙った。滴状の入りと連続する太細を全字へ通し、ねの低い輪を固有の造形とする。", "brand_intent": "雪国を訪れる人へ、音楽と静かな滞在の余韻を届ける。", "image": "assets/N080.jpg", "thumb": "assets/N080-thumb.jpg"}, {"id": "N083", "name": "こまのわ", "group": "N 参考からの新規案", "description": "独楽工房", "intent": "回転の軌道を開いた円にして、二組のかなを外周の対角へ置いた。全字の弧と細太の変化を揃え、まの小輪とわの大輪で回転の大小をつくる。", "brand_intent": "独楽を回す楽しみを子どもと大人へ届ける木工工房。", "image": "assets/N083.jpg", "thumb": "assets/N083-thumb.jpg"}, {"id": "N084", "name": "しなる", "group": "N 参考からの新規案", "description": "曲木家具工房", "intent": "細い折返しと広い外弧をかなの運筆へ置き換え、曲木の張力を文字だけで狙った。なの輪に折返しの絞りを設け、全字の端を緩く開く平切りで統一する。", "brand_intent": "曲木のしなりを日々触れられる家具として届ける。", "image": "assets/N084.jpg", "thumb": "assets/N084-thumb.jpg"}, {"id": "F01", "name": "ITOHI", "group": "F 内容適合の比較案", "description": "織物工房", "intent": "縦糸と横糸が交差して布になる工程を、5本の細い縦線と交互に通る1本の横糸、下端の密な織り目へ置き換える設計。細いITOHIと黒い余白を合わせ、張った糸と織り上がる密度を対比させる。", "brand_intent": "", "image": "assets/F01.jpg", "thumb": "assets/F01-thumb.jpg"}, {"id": "F02", "name": "KANADO", "group": "F 内容適合の比較案", "description": "金属道具の製作工房", "intent": "金属を鍛えて道具へ変える仕事を、平らな作業面と絞った胴を持つ白い金床の量塊へ託す設計。左右の細い金属・道具と下のセリフ文字で、強いマークと繊細な手仕事を対比させる。", "brand_intent": "", "image": "assets/F02.jpg", "thumb": "assets/F02-thumb.jpg"}, {"id": "F03", "name": "PROOF", "group": "F 内容適合の比較案", "description": "校正・編集事務所", "intent": "抜けた言葉を挿入する校正動作を、PROOFの2つのOの間へ入る細い挿入記号に置き換える設計。文字本体を壊さず字間だけを整え、1つの小さな介入で編集の役割を示す。", "brand_intent": "", "image": "assets/F03.jpg", "thumb": "assets/F03-thumb.jpg"}, {"id": "F04", "name": "むすび / MUSUBI", "group": "F 内容適合の比較案", "description": "おにぎり専門店", "intent": "手で握るおにぎりの不均一な丸みを、閉じた太い輪郭と下端の海苔の四角で捉える設計。中央の細いむすびと下のMUSUBIを太い外形と対比させ、手の柔らかさと店名を一体で扱うことを狙う。", "brand_intent": "", "image": "assets/F04.jpg", "thumb": "assets/F04-thumb.jpg"}, {"id": "F05", "name": "街間 / MACHIMA", "group": "F 内容適合の比較案", "description": "地域の建築相談室", "intent": "路地と部屋の関係を、街間の骨格を生かした細い作図線と2文字の間の通路のような白地へ移す設計。必要な接点だけを少し開き、軽い線の文字組みで街に光が通る感覚を狙う。", "brand_intent": "", "image": "assets/F05.jpg", "thumb": "assets/F05-thumb.jpg"}, {"id": "F06", "name": "PAPERLY 10 YEARS", "group": "F 内容適合の比較案"
